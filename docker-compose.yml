services:
    db:
        image: postgres:17
        container_name: gabaritol-postgres
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=password
            - POSTGRES_DB=springbootdb
        ports:
            - "5432:5432"

    cache:
        image: redis/redis-stack:latest
        container_name: gabaritol-redis
        environment:
            - REDIS_ARGS=--requirepass password
        ports:
            - "6379:6379"
            - "8001:8001"

    app:
        build: .
        container_name: gabaritol-app
        depends_on:
            - db
            - cache
        environment:
            - REDIS_HOST=cache
            - REDIS_PORT=6379
            - REDIS_PASSWORD=password
        ports:
            - "8080:8080"
